services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8080
      REDIS_HOST: redis
      FILESYSTEM_DISK: public
    depends_on:
      - redis
    networks:
      - integration_network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - integration_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - integration_network

networks:
  integration_network:
    driver: bridge
